<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#1e3c72">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/svg+xml" href="icon.svg">
    <link rel="icon" type="image/png" href="icon.png">
    <link rel="apple-touch-icon" href="icon.png">
    <title>智能收据管家</title>
    <style>
        :root {
            --primary: #1e3c72;
            --primary-light: #2a5298;
            --accent: #e11d48;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --radius-lg: 20px;
            --radius-md: 14px;
            --radius-sm: 8px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: var(--text-main); padding-bottom: 90px; }

        /* 顶部导航 */
        header { 
            background: linear-gradient(135deg, var(--primary), var(--primary-light)); 
            color: white; 
            padding: 22px 18px 18px; 
            border-radius: 0 0 28px 28px; 
            box-shadow: 0 8px 20px rgba(30, 60, 114, 0.18); 
        }
        .header-top { display: flex; justify-content: space-between; align-items: center; }
        .logo-area { display: flex; align-items: center; gap: 10px; }
        .logo-img { width: 34px; height: 34px; border-radius: 8px; }
        h1 { font-size: 20px; font-weight: 800; letter-spacing: 0.5px; }

        .header-actions { display: flex; gap: 8px; }
        .icon-btn { 
            background: rgba(255, 255, 255, 0.2); 
            border: none; 
            color: white; 
            padding: 6px 11px; 
            border-radius: 20px; 
            font-size: 12px; 
            font-weight: 600; 
            cursor: pointer; 
            backdrop-filter: blur(8px);
            transition: 0.15s;
        }
        .icon-btn:active { background: rgba(255, 255, 255, 0.35); transform: scale(0.96); }

        /* 用户与模式栏 */
        .user-switch-bar { 
            background: rgba(255, 255, 255, 0.15); 
            border-radius: 14px; 
            padding: 9px 12px; 
            margin-top: 14px; 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            backdrop-filter: blur(10px);
        }
        .user-select { 
            background: white; 
            border: none; 
            border-radius: 8px; 
            padding: 6px 10px; 
            font-size: 13px; 
            font-weight: 700; 
            color: var(--primary); 
            outline: none; 
        }

        .container { padding: 16px; max-width: 600px; margin: 0 auto; }
        .card { 
            background: var(--card-bg); 
            border-radius: var(--radius-lg); 
            padding: 18px; 
            margin-bottom: 15px; 
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.03); 
            border: 1px solid var(--border-color);
        }

        /* 模式指示徽章 */
        .engine-badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-size: 11px;
            font-weight: 700;
            padding: 4px 9px;
            border-radius: 12px;
            background: #eff6ff;
            color: #1d4ed8;
            margin-bottom: 12px;
        }

        /* 拍照 & 上传区域 */
        .upload-area { 
            border: 2px dashed #93c5fd; 
            border-radius: 16px; 
            padding: 24px 16px; 
            text-align: center; 
            cursor: pointer; 
            background: #f0f7ff; 
            transition: 0.2s; 
        }
        .upload-area:active { background: #dbeafe; }
        .upload-icon { font-size: 40px; margin-bottom: 6px; }

        /* 按钮与表单 */
        .btn { 
            display: inline-flex; 
            align-items: center; 
            justify-content: center; 
            width: 100%; 
            padding: 13px; 
            font-size: 15px; 
            font-weight: 700; 
            border: none; 
            border-radius: var(--radius-md); 
            cursor: pointer; 
            transition: 0.15s; 
        }
        .btn-primary { background: linear-gradient(135deg, var(--primary), var(--primary-light)); color: white; box-shadow: 0 4px 12px rgba(30,60,114,0.2); }
        .btn-primary:active { transform: scale(0.98); }
        .btn-secondary { background: #e2e8f0; color: #475569; }

        input[type="file"] { display: none; }

        /* 筛选器 */
        .filter-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
        .cat-select { 
            width: 100%; 
            padding: 9px 12px; 
            border-radius: 10px; 
            border: 1.5px solid var(--border-color); 
            font-size: 13px; 
            background: #f8fafc; 
            color: var(--text-main); 
            outline: none; 
        }
        .cat-select:focus { border-color: var(--primary-light); }

        .search-input {
            width: 100%;
            padding: 10px 14px;
            border-radius: 12px;
            border: 1.5px solid var(--border-color);
            font-size: 14px;
            outline: none;
            background: #ffffff;
            transition: 0.2s;
        }
        .search-input:focus { border-color: var(--primary-light); box-shadow: 0 0 0 3px rgba(42, 82, 152, 0.1); }

        /* 统计栏 */
        .stats-bar { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            font-size: 13px; 
            color: var(--text-muted); 
            margin-bottom: 12px; 
            padding: 10px 14px; 
            background: #f1f5f9; 
            border-radius: 12px; 
        }
        .total-amount { color: var(--accent); font-weight: 900; font-size: 18px; }

        /* 收据卡片 */
        .receipt-item { 
            border-left: 5px solid var(--primary-light); 
            padding: 16px; 
            background: #fff; 
            margin-bottom: 12px; 
            border-radius: 14px; 
            box-shadow: 0 2px 8px rgba(0,0,0,0.03); 
            border: 1px solid var(--border-color);
            transition: 0.15s; 
        }
        .receipt-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; }
        .merchant { font-weight: 800; font-size: 17px; color: var(--text-main); }
        .amount { color: var(--accent); font-weight: 900; font-size: 19px; }
        .receipt-info { font-size: 13px; color: var(--text-muted); margin-bottom: 10px; line-height: 1.5; }
        
        .receipt-photo-thumb {
            width: 50px;
            height: 50px;
            object-fit: cover;
            border-radius: 8px;
            cursor: pointer;
            border: 1px solid #cbd5e1;
        }

        .actions { display: flex; gap: 8px; align-items: center; justify-content: space-between; padding-top: 8px; border-top: 1px dashed var(--border-color); }
        .btn-edit { background: #e0f2fe; color: #0284c7; border: none; padding: 6px 12px; border-radius: 8px; font-size: 12px; cursor: pointer; font-weight: 700; }
        .btn-del { background: #fee2e2; color: #dc2626; border: none; padding: 6px 12px; border-radius: 8px; font-size: 12px; cursor: pointer; font-weight: 700; }

        /* 弹窗 Modal */
        .modal-overlay { 
            position: fixed; 
            top: 0; left: 0; right: 0; bottom: 0; 
            background: rgba(15, 23, 42, 0.65); 
            display: none; 
            align-items: center; 
            justify-content: center; 
            z-index: 9999; 
            padding: 16px; 
            backdrop-filter: blur(4px); 
        }
        .modal-box { 
            background: white; 
            border-radius: 24px; 
            width: 100%; 
            max-width: 480px; 
            padding: 24px; 
            box-shadow: 0 16px 36px rgba(0,0,0,0.25); 
            animation: modalIn 0.2s ease-out; 
            max-height: 90vh; 
            overflow-y: auto; 
        }
        @keyframes modalIn { from { transform: scale(0.92); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        .form-group { margin-bottom: 13px; }
        .form-group label { display: block; font-size: 13px; font-weight: 700; color: #475569; margin-bottom: 5px; }
        .form-control { width: 100%; padding: 11px 13px; border: 1.5px solid var(--border-color); border-radius: 12px; font-size: 14px; outline: none; }
        .form-control:focus { border-color: var(--primary-light); }

        .loading { display: none; text-align: center; color: var(--primary); font-size: 14px; margin: 12px 0; font-weight: 700; }
        .ai-answer { margin-top: 12px; padding: 14px; background: #f0fdf4; border: 1px solid #bbf7d0; border-radius: 12px; font-size: 14px; color: #166534; display: none; line-height: 1.6; white-space: pre-wrap; }
    </style>
</head>
<body>
    <header>
        <div class="header-top">
            <div class="logo-area">
                <img src="icon.svg" class="logo-img" alt="Logo">
                <h1>智能收据管家</h1>
            </div>
            <div class="header-actions">
                <button class="icon-btn" onclick="openFeedbackModal()">💬 反馈</button>
                <button class="icon-btn" onclick="openSettingsModal()">⚙️ 设置</button>
            </div>
        </div>

        <div class="user-switch-bar">
            <span style="font-size:13px; font-weight:700;">👤 当前账本:</span>
            <select id="userSelect" class="user-select" onchange="onUserChange(this.value)"></select>
            <button class="icon-btn" style="background:rgba(255,255,255,0.25);" onclick="addUser()">+ 新账本</button>
        </div>
    </header>

    <div class="container">
        <!-- 拍照 / 记账卡片 -->
        <div class="card">
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <span class="engine-badge" id="currentEngineBadge">🤖 当前引擎: Gemini</span>
                <span style="font-size:12px; color:var(--text-muted); cursor:pointer;" onclick="openSettingsModal()">切换引擎 ➔</span>
            </div>

            <label for="cameraInput">
                <div class="upload-area">
                    <div class="upload-icon">📸</div>
                    <b>点击拍照或选择小票</b>
                    <p style="font-size: 12px; color: var(--text-muted); margin-top: 4px;" id="uploadSubtext">支持智能识别或纯手动存图记账</p>
                </div>
            </label>
            <input type="file" id="cameraInput" accept="image/*" capture="environment">

            <!-- 纯手动无图快速记账入口 -->
            <button class="btn" style="background:#f1f5f9; color:#475569; margin-top:10px; font-size:13px; padding:10px;" onclick="openManualNewReceipt()">✍️ 不拍照，直接手动输入记账</button>

            <div id="uploadLoading" class="loading">⏳ 正在处理收据中，请稍候...</div>
        </div>

        <!-- 专属 AI 查账 (当选择手动模式时自动隐藏或提示) -->
        <div class="card" id="aiQueryCard">
            <h3 style="font-size: 15px; margin-bottom: 8px;" id="aiCardTitle">🤖 智能问账分析</h3>
            <div style="display:flex; gap:8px;">
                <input type="text" id="aiQuery" class="search-input" placeholder="例如: 我买数码一共花了多少钱？">
                <button class="btn btn-primary" style="width: auto; padding: 10px 18px;" onclick="askAi()">提问</button>
            </div>
            <div id="aiLoading" class="loading">🔍 正在统计分析账单明细...</div>
            <div id="aiAnswer" class="ai-answer"></div>
        </div>

        <!-- 多维时间/分类/搜索筛选器 -->
        <div class="card" style="padding: 16px;">
            <div style="font-size: 13px; font-weight: 800; color: var(--primary); margin-bottom: 10px; display:flex; justify-content:space-between; align-items:center;">
                <span>🔎 多维时光轴筛选 (年/月/日/类别)</span>
                <button onclick="resetFilters()" style="background:none; border:none; color:var(--accent); font-size:12px; cursor:pointer; font-weight:700;">重置条件</button>
            </div>
            <div class="filter-grid">
                <select id="filterYear" class="cat-select" onchange="applyFilters()">
                    <option value="ALL">📅 所有年份</option>
                </select>
                <select id="filterMonth" class="cat-select" onchange="applyFilters()">
                    <option value="ALL">📆 所有月份</option>
                </select>
            </div>
            <div class="filter-grid">
                <select id="filterCategory" class="cat-select" onchange="applyFilters()">
                    <option value="ALL">🏷️ 所有消费类别</option>
                </select>
                <input type="date" id="filterExactDate" class="cat-select" onchange="applyFilters()" title="特定某天">
            </div>
            <input type="text" id="filterKeyword" class="search-input" placeholder="🔍 快速搜索商家名或商品..." oninput="applyFilters()">
        </div>

        <!-- 收据列表 -->
        <div class="card">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
                <h3 style="font-size: 16px; font-weight:800;" id="listTitle">📋 收据清单</h3>
                <div style="display:flex; gap:8px;">
                    <button onclick="exportUserData()" style="background:none; border:none; color:var(--primary-light); font-size:12px; cursor:pointer; font-weight:600;">💾 导出备份</button>
                    <button onclick="renderCurrentUser()" style="background:none; border:none; color:var(--primary-light); font-size:12px; cursor:pointer; font-weight:600;">🔄 刷新</button>
                </div>
            </div>
            <div class="stats-bar">
                <span id="totalCount">共 0 条收据</span>
                <span id="totalAmount" class="total-amount">RM 0.00</span>
            </div>
            <div id="receiptList"></div>
        </div>
    </div>

    <!-- 模态框 1: 核对与编辑收据 -->
    <div id="editModal" class="modal-overlay">
        <div class="modal-box">
            <h3 id="modalTitle" style="font-size: 18px; font-weight: 800; color: var(--primary); margin-bottom: 14px;">📋 核对收据信息</h3>
            
            <div id="modalPhotoPreview" style="display:none; margin-bottom:12px; text-align:center;">
                <img id="modalPreviewImg" style="max-height:160px; max-width:100%; border-radius:10px; border:1px solid #cbd5e1;">
            </div>

            <div class="form-group">
                <label>商家名称</label>
                <input type="text" id="editMerchant" class="form-control" placeholder="例如: Lotus's, 99 Speedmart, 餐厅">
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                <div class="form-group">
                    <label>实付总额 (RM)</label>
                    <input type="number" step="0.01" id="editAmount" class="form-control" placeholder="0.00">
                </div>
                <div class="form-group">
                    <label>消费日期</label>
                    <input type="date" id="editDate" class="form-control">
                </div>
            </div>

            <div class="form-group">
                <label>消费分类</label>
                <select id="editCategory" class="form-control"></select>
            </div>

            <div class="form-group">
                <label>商品明细 / 备注</label>
                <textarea id="editNotes" class="form-control" rows="2" placeholder="填写具体买了什么（例如: 2盒牛奶、全麦面包），方便后续 AI 查账回答！"></textarea>
            </div>

            <div style="display: flex; gap: 10px; margin-top: 18px;">
                <button class="btn btn-primary" onclick="confirmSaveModal()">✓ 确认保存并归档</button>
                <button class="btn btn-secondary" onclick="closeEditModal()">取消</button>
            </div>
        </div>
    </div>

    <!-- 模态框 2: 系统与 API 引擎设置 -->
    <div id="settingsModal" class="modal-overlay">
        <div class="modal-box">
            <h3 style="font-size: 18px; font-weight: 800; color: var(--primary); margin-bottom: 14px;">⚙️ AI 引擎与安全设置</h3>
            
            <div class="form-group">
                <label>选择识别模式 / AI 引擎</label>
                <select id="engineSelect" class="form-control" onchange="onEngineChange(this.value)">
                    <option value="gemini">🔹 Google Gemini (多模态)</option>
                    <option value="qwen">🔹 通义千问 Qwen 2.5-VL (安全开源模型)</option>
                    <option value="manual">✍️ 纯手动拍照记账 (无 AI，0 流量消耗)</option>
                </select>
            </div>

            <div id="geminiKeyGroup" class="form-group">
                <label>Gemini API Key</label>
                <input type="password" id="geminiKeyInput" class="form-control" placeholder="输入你的 Gemini Key (AIzaSy...)">
                <p style="font-size:11px; color:var(--text-muted); margin-top:4px;">使用 Google 官方 gemini-1.5-flash 高速多模态模型</p>
            </div>

            <div id="qwenKeyGroup" class="form-group" style="display:none;">
                <label>千问接口服务商</label>
                <select id="qwenProviderSelect" class="form-control" onchange="onQwenProviderChange(this.value)">
                    <option value="siliconflow">⚡ 硅基流动 SiliconFlow (免翻墙，网页无跨域拦截，推荐)</option>
                    <option value="dashscope">🏛️ 阿里云百炼官方 DashScope (适用于原生App/代理)</option>
                    <option value="openrouter">🌐 OpenRouter (含免费版 Qwen 2.5-VL，海外直连)</option>
                    <option value="custom">🛠️ 自定义兼容接口 (Base URL)</option>
                </select>

                <div id="qwenCustomUrlGroup" style="display:none; margin-top:8px;">
                    <label style="font-size:12px;">自定义 Base URL</label>
                    <input type="text" id="qwenCustomUrlInput" class="form-control" placeholder="例如: https://api.yourproxy.com/v1">
                </div>

                <div style="margin-top:8px;">
                    <label id="qwenKeyLabel">API Key</label>
                    <input type="password" id="qwenKeyInput" class="form-control" placeholder="输入对应平台的 API Key (sk-...)">
                </div>
                <p style="font-size:11px; color:var(--text-muted); margin-top:4px;" id="qwenTipText">
                    提示：纯网页端调用阿里云百炼会被浏览器拦截(CORS)，推荐使用【硅基流动】，国内免翻墙且原生支持网页调用！
                </p>
            </div>

            <div style="display: flex; gap: 10px; margin-top: 20px;">
                <button class="btn btn-primary" onclick="saveSettings()">保存设置</button>
                <button class="btn btn-secondary" onclick="closeSettingsModal()">关闭</button>
            </div>
        </div>
    </div>

    <!-- 模态框 3: 意见反馈 (Feedback) -->
    <div id="feedbackModal" class="modal-overlay">
        <div class="modal-box">
            <h3 style="font-size: 18px; font-weight: 800; color: var(--primary); margin-bottom: 14px;">💬 提交意见反馈</h3>
            <p style="font-size:13px; color:var(--text-muted); margin-bottom:12px;">您的反馈将直接记录供开发者跟进与优化！</p>

            <div class="form-group">
                <label>反馈类别</label>
                <select id="fbType" class="form-control">
                    <option value="功能建议">💡 功能改进与建议</option>
                    <option value="识别问题">🔍 收据识别不准确</option>
                    <option value="系统Bug">⚠️ 报错或Bug</option>
                    <option value="其他">💬 其他想法</option>
                </select>
            </div>

            <div class="form-group">
                <label>联系方式 (可选)</label>
                <input type="text" id="fbContact" class="form-control" placeholder="邮箱 / 微信号，方便跟进">
            </div>

            <div class="form-group">
                <label>详细反馈内容</label>
                <textarea id="fbContent" class="form-control" rows="4" placeholder="请具体描述您的建议或遇到的问题..."></textarea>
            </div>

            <div style="display: flex; gap: 10px; margin-top: 18px;">
                <button class="btn btn-primary" onclick="submitFeedback()">提交反馈</button>
                <button class="btn btn-secondary" onclick="closeFeedbackModal()">取消</button>
            </div>
        </div>
    </div>

    <script>
        const categories = ["餐饮美食", "超市便利", "交通出行", "休闲娱乐", "医疗保健", "电子数码", "其他"];

        // 存储键定义
        const USERS_KEY = "receipt_app_users_list";
        const CURRENT_USER_KEY = "receipt_app_active_user";
        const STORAGE_PREFIX = "phone_receipts_user_";
        const ENGINE_KEY = "receipt_app_selected_engine";
        const GEMINI_KEY_STORAGE = "my_personal_gemini_key";
        const QWEN_KEY_STORAGE = "my_personal_qwen_key";
        const QWEN_PROVIDER_STORAGE = "receipt_app_qwen_provider";
        const QWEN_CUSTOM_URL_STORAGE = "receipt_app_qwen_custom_url";
        const FEEDBACK_STORAGE = "receipt_app_local_feedback_list";

        // 获取当前 AI 引擎
        function getSelectedEngine() {
            return localStorage.getItem(ENGINE_KEY) || "gemini";
        }

        // 初始化
        window.onload = function() {
            initUserSelect();
            initCategoryFilter();
            updateEngineUI();
            renderCurrentUser();
        };

        // 更新引擎 UI 提示
        function updateEngineUI() {
            const engine = getSelectedEngine();
            const badge = document.getElementById('currentEngineBadge');
            const subtext = document.getElementById('uploadSubtext');
            const aiCard = document.getElementById('aiQueryCard');

            if (engine === 'gemini') {
                badge.innerText = '🤖 当前引擎: Google Gemini';
                subtext.innerText = '拍照后由 Gemini 自动识别实付 RM 金额';
                aiCard.style.display = 'block';
            } else if (engine === 'qwen') {
                badge.innerText = '🌐 当前引擎: 开源千问 Qwen 2.5-VL';
                subtext.innerText = '拍照后由开源大模型安全识别小票';
                aiCard.style.display = 'block';
            } else {
                badge.innerText = '✍️ 当前模式: 纯手动拍照记账';
                subtext.innerText = '仅拍照保存小票图片，无需 AI，纯本地记账';
                aiCard.style.display = 'none'; // 手动模式隐藏 AI 提问卡片
            }
        }

        // 用户账本管理
        function getUserList() {
            try {
                let users = JSON.parse(localStorage.getItem(USERS_KEY));
                if (!users || users.length === 0) {
                    users = ["默认用户", "家庭公账"];
                    localStorage.setItem(USERS_KEY, JSON.stringify(users));
                }

        // 筛选逻辑
        function initCategoryFilter() {
            const catSel = document.getElementById('filterCategory');
            catSel.innerHTML = '<option value="ALL">🏷️ 所有消费类别</option>' + categories.map(c => `<option value="${c}">${c}</option>`).join('');
        }

        function updateTimeFilterOptions(list) {
            const yearSel = document.getElementById('filterYear');
            const monthSel = document.getElementById('filterMonth');
            const curY = yearSel.value;
            const curM = monthSel.value;

            const years = new Set();
            const months = new Set();

            list.forEach(r => {
                if (r.date && r.date.length >= 7) {
                    const parts = r.date.split('-');
                    if (parts[0]) years.add(parts[0]);
                    if (parts[1]) months.add(parts[1]);
                }
            });

            const sortedY = Array.from(years).sort().reverse();
            yearSel.innerHTML = '<option value="ALL">📅 所有年份</option>' + sortedY.map(y => `<option value="${y}" ${y === curY ? 'selected' : ''}>${y} 年</option>`).join('');

            const sortedM = Array.from(months).sort();
            monthSel.innerHTML = '<option value="ALL">📆 所有月份</option>' + sortedM.map(m => `<option value="${m}" ${m === curM ? 'selected' : ''}>${m} 月</option>`).join('');
        }

        function applyFilters() {
            const all = getCurrentUserReceipts();
            const y = document.getElementById('filterYear').value;
            const m = document.getElementById('filterMonth').value;
            const c = document.getElementById('filterCategory').value;
            const d = document.getElementById('filterExactDate').value;
            const k = document.getElementById('filterKeyword').value.trim().toLowerCase();

            const filtered = all.filter(r => {
                if (d && r.date !== d) return false;
                if (y !== 'ALL' && !r.date.startsWith(y)) return false;
                if (m !== 'ALL') {
                    const p = r.date.split('-');
                    if (p.length < 2 || p[1] !== m) return false;
                }
                if (c !== 'ALL' && r.category !== c) return false;
                if (k) {
                    const merc = (r.merchant || '').toLowerCase();
                    const note = (r.notes || '').toLowerCase();
                    if (!merc.includes(k) && !note.includes(k)) return false;
                }
                return true;
            });

            const isFiltered = (y !== 'ALL' || m !== 'ALL' || c !== 'ALL' || d !== '' || k !== '');
            renderList(filtered, isFiltered);
        }

        function resetFilters() {
            document.getElementById('filterYear').value = 'ALL';
            document.getElementById('filterMonth').value = 'ALL';
            document.getElementById('filterCategory').value = 'ALL';
            document.getElementById('filterExactDate').value = '';
            document.getElementById('filterKeyword').value = '';
            renderCurrentUser();
        }

        function renderCurrentUser() {

        // Gemini 识别
        async function processWithGemini(base64Data, photoDataUrl) {
            const key = localStorage.getItem(GEMINI_KEY_STORAGE) || "";
            if (!key) {
                alert("请先点击右上角【⚙️ 设置】配置您的 Gemini API Key！");
                document.getElementById('uploadLoading').style.display = 'none';
                openSettingsModal();
                return;
            }

            const prompt = "请分析这张收据/发票（通常为马来西亚RM格式），提取实付总额(Net Paid纯浮点数)并仅输出纯JSON：{\"merchant\": \"商家名\", \"date\": \"YYYY-MM-DD\", \"amount\": 12.34, \"category\": \"餐饮美食\", \"notes\": \"商品名\"}";
            const payload = {
                contents: [{ parts: [{ text: prompt }, { inline_data: { mime_type: "image/jpeg", data: base64Data } }] }]
            };

            try {
                const res = await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'x-goog-api-key': key },
                    body: JSON.stringify(payload)
                });
                const data = await res.json();
                if (data.error) throw new Error(data.error.message || JSON.stringify(data.error));

                let text = data.candidates[0].content.parts[0].text;
                const start = text.indexOf('{'), end = text.lastIndexOf('}');
                if (start !== -1 && end !== -1) text = text.substring(start, end + 1);
                const parsed = JSON.parse(text);

                openEditModal({
                    id: 'rc_' + Date.now(),
                    merchant: parsed.merchant || '未知商家',
                    date: parsed.date || new Date().toISOString().split('T')[0],
                    amount: Number(parsed.amount) || 0.0,
                    category: parsed.category || '其他',
                    notes: parsed.notes || '',
                    photo: photoDataUrl,
                    engine: 'Gemini 1.5'
                }, true);
            } catch(e) {
                alert('Gemini 识别出错: ' + e.message);
            } finally {
                document.getElementById('uploadLoading').style.display = 'none';
                document.getElementById('cameraInput').value = '';
            }
        }

        // Qwen 2.5-VL 开源多模态识别 (兼容 OpenAI 视觉格式)
        async function processWithQwen(base64Data, photoDataUrl) {
            const key = localStorage.getItem(QWEN_KEY_STORAGE) || "";
            if (!key) {
                alert("请先点击右上角【⚙️ 设置】配置您的千问 API Key！");
                document.getElementById('uploadLoading').style.display = 'none';
                openSettingsModal();
                return;
            }

            const provider = localStorage.getItem(QWEN_PROVIDER_STORAGE) || "siliconflow";
            let endpoint = "";
            let model = "";

            if (provider === "dashscope") {
                endpoint = "https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions";
                model = "qwen-vl-plus";
            } else if (provider === "openrouter") {
                endpoint = "https://openrouter.ai/api/v1/chat/completions";
                model = "qwen/qwen-2.5-vl-72b-instruct";
            } else if (provider === "custom") {
                let base = (localStorage.getItem(QWEN_CUSTOM_URL_STORAGE) || "").replace(/\/$/, "");
                endpoint = base + "/chat/completions";
                model = "Qwen/Qwen2.5-VL-7B-Instruct";
            } else {
                endpoint = "https://api.siliconflow.cn/v1/chat/completions";
                model = "Qwen/Qwen2.5-VL-7B-Instruct";
            }

            const prompt = "请分析这张收据小票（通常为马来西亚RM格式），提取实付RM金额，输出纯JSON: {\"merchant\": \"商家\", \"date\": \"YYYY-MM-DD\", \"amount\": 12.34, \"category\": \"餐饮美食\", \"notes\": \"主要物品\"}";
            const payload = {
                model: model,
                messages: [
                    {
                        role: "user",
                        content: [
                            { type: "text", text: prompt },
                            { type: "image_url", image_url: { url: `data:image/jpeg;base64,${base64Data}` } }
                        ]
                    }
                ]
            };

            try {
                const res = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + key },
                    body: JSON.stringify(payload)
                });
                const data = await res.json();
                if (data.error) throw new Error(data.error.message || JSON.stringify(data.error));

                let text = data.choices[0].message.content;
                const start = text.indexOf('{'), end = text.lastIndexOf('}');
                if (start !== -1 && end !== -1) text = text.substring(start, end + 1);
                const parsed = JSON.parse(text);

                openEditModal({
                    id: 'rc_' + Date.now(),
                    merchant: parsed.merchant || '未知商家',
                    date: parsed.date || new Date().toISOString().split('T')[0],
                    amount: Number(parsed.amount) || 0.0,
                    category: parsed.category || '其他',
                    notes: parsed.notes || '',
                    photo: photoDataUrl,
                    engine: 'Qwen 2.5-VL'
                }, true);
            } catch(e) {
                let msg = e.message;
                if (msg.includes('Failed to fetch') && provider === 'dashscope') {
                    msg = "阿里云百炼官方接口被浏览器拦截(CORS跨域)！\n\n解决方案：\n点击右上角【设置】，将千问服务商切换为【硅基流动 SiliconFlow】（国内免翻墙、原生支持网页调用），或者等待打包成安卓原生App后即可直连阿里云！";
                }
                alert('千问模型识别出错: ' + msg);
            } finally {
                document.getElementById('uploadLoading').style.display = 'none';
                document.getElementById('cameraInput').value = '';
            }
        }

        async function askAi() {

            localStorage.setItem(ENGINE_KEY, eng);

            const gKey = document.getElementById('geminiKeyInput').value.trim();
            if (gKey) localStorage.setItem(GEMINI_KEY_STORAGE, gKey);

            const qKey = document.getElementById('qwenKeyInput').value.trim();
            if (qKey) localStorage.setItem(QWEN_KEY_STORAGE, qKey);

            const prov = document.getElementById('qwenProviderSelect').value;
            localStorage.setItem(QWEN_PROVIDER_STORAGE, prov);

            const customUrl = document.getElementById('qwenCustomUrlInput').value.trim();
            if (customUrl) localStorage.setItem(QWEN_CUSTOM_URL_STORAGE, customUrl);

            updateEngineUI();
            closeSettingsModal();
            alert("✅ 设置已保存！");
        }

        // 意见反馈 (Feedback)
        function openFeedbackModal() {
            document.getElementById('feedbackModal').style.display = 'flex';
        }

        function closeFeedbackModal() {
            document.getElementById('feedbackModal').style.display = 'none';
            document.getElementById('fbContent').value = '';
        }

        function submitFeedback() {
            const type = document.getElementById('fbType').value;
            const contact = document.getElementById('fbContact').value.trim();
            const content = document.getElementById('fbContent').value.trim();

            if (!content) { alert('请输入您的反馈内容！'); return; }

            const feedbackItem = {
                id: 'fb_' + Date.now(),
                time: new Date().toLocaleString(),
                type: type,
                contact: contact || '匿名',
                content: content,
                userAgent: navigator.userAgent
            };

            // 1. 保存在本地
            let allFb = [];
            try { allFb = JSON.parse(localStorage.getItem(FEEDBACK_STORAGE)) || []; } catch(e) {}
            allFb.unshift(feedbackItem);
            localStorage.setItem(FEEDBACK_STORAGE, JSON.stringify(allFb));

            // 2. 尝试向电脑端后端同步 (如果电脑开着服务)
            fetch('/api/feedback', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(feedbackItem)
            }).catch(() => {});

            alert('💌 感谢您的宝贵反馈！已成功提交！');
            closeFeedbackModal();
        }

        // 导出备份
        function exportUserData() {
            const u = getCurrentUser();
            const list = getCurrentUserReceipts();
            const blob = new Blob([JSON.stringify(list, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = u + '_收据账单备份_' + new Date().toISOString().split('T')[0] + '.json';
            a.click();
        }
    </script>
</body>
</html>
